<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, minimal-ui, viewport-fit=cover" />
    <meta name="description" content="SummerTime — an interactive WebGL summer afternoon." />
    <meta name="theme-color" content="#fffdf8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon16.png" />
    <title>SummerTime</title>
    <!--
      Player page: what X (Twitter) embeds in the timeline. The posted link
      opens /r (the card page); this page is the twitter:player target and
      loads inside a 480x480 iframe, so it must fill the frame completely —
      no chrome, no scrollbars. Card meta tags intentionally live on /r:
      a player card is only valid when the link URL and the player URL differ.
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #fffdf8; }
      #app { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
