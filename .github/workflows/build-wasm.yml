name: build-wasm

# Rebuilds and publishes the P2P wasm package whenever the Rust multiplayer
# code (or the build pipeline itself) changes. The Cloudflare deploy then
# uploads the committed package without needing any Rust toolchain.
#
# Trigger: EVERY push to main — not path-filtered. The job always concludes:
# when no wasm inputs changed it skips the build and reports success in
# seconds. `workflow_dispatch` allows a manual rebuild at any time.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One wasm build at a time; a newer push cancels the older one — the
  # newest run rebuilds from the newest HEAD and publishes the result.
  group: build-wasm
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish wasm package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the changed-files diff works for any push shape.
          fetch-depth: 0

      - name: Check whether wasm inputs changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$base" "${{ github.sha }}" -- multiplayer scripts/build-wasm.sh package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No wasm inputs changed
        if: steps.changes.outputs.changed == 'false'
        run: echo "Nothing under multiplayer/ changed; the committed wasm package is current."

      # Pin the exact toolchain used locally (1.96.0) so CI and local builds
      # are byte-comparable; bump deliberately when the local toolchain moves.
      - name: Install Rust toolchain (wasm32 target)
        if: steps.changes.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      # The big one: caches ~/.cargo registry + multiplayer/target, so
      # rebuilds only recompile the changed crate instead of all of iroh.
      # The key covers the Cargo.lock hash and toolchain, so it stays warm
      # across pushes and invalidates exactly when the inputs change.
      - name: Cache cargo registry and build artifacts
        if: steps.changes.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: multiplayer

      - name: Install wasm-pack (pinned prebuilt binary)
        if: steps.changes.outputs.changed == 'true'
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          wasm-pack-version: '0.15.0'

      # ring compiles C for wasm32 with clang, cc-rs archives objects with
      # llvm-ar/llvm-ranlib, and rustc links the final wasm with wasm-ld.
      # The runner image only guarantees clang, so install the full LLVM
      # toolchain and guarantee the unversioned tool names (distro packaging
      # version-suffixes them, e.g. wasm-ld-18).
      - name: Ensure C toolchain for wasm (clang, llvm-ar, wasm-ld)
        if: steps.changes.outputs.changed == 'true'
        run: |
          if ! command -v clang >/dev/null 2>&1 || ! command -v llvm-ar >/dev/null 2>&1 || ! command -v wasm-ld >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang llvm-18 lld-18
          fi
          for tool in llvm-ar llvm-ranlib wasm-ld; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              sudo ln -sf "/usr/lib/llvm-18/bin/$tool" "/usr/bin/$tool"
            fi
          done
          clang --version | head -1
          llvm-ar --version | head -1
          wasm-ld --version | head -1

      - name: Build the wasm package
        if: steps.changes.outputs.changed == 'true'
        run: bash scripts/build-wasm.sh

      # Publish: commit the refreshed pkg back to main (pushes made with
      # GITHUB_TOKEN do not re-trigger this workflow, so no loops).
      - name: Publish the refreshed package
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add multiplayer/browser-wasm/pkg
          if git diff --cached --quiet; then
            echo "wasm package unchanged, nothing to commit"
          else
            git commit -m "build(wasm): refresh p2p wasm package"
            git push
          fi
