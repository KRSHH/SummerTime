[package]
name = "summer-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "summer-cli"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
hex = "0.4"
iroh = { workspace = true }
n0-future = "0.3"
summer-shared = { path = "../shared" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = "0.3"
